<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Siren base -->
  <rect x="14" y="34" width="36" height="14" rx="3" fill="#111827" stroke="#374151" stroke-width="2"/>
  <!-- Siren light -->
  <rect x="18" y="18" width="28" height="18" rx="4" fill="url(#g)" stroke="#1f2937" stroke-width="2"/>
  <!-- Beacon rays -->
  <g stroke="#ef4444" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="12" stroke-width="3"/>
    <line x1="48" y1="10" x2="44" y2="14" stroke-width="2"/>
    <line x1="16" y1="10" x2="20" y2="14" stroke-width="2"/>
  </g>
</svg>
